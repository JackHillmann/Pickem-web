name: Pickem Scheduler

# Scheduling moved to cron-job.org (2026-08-14) — GitHub Actions' free-tier
# `schedule:` trigger was silently dropping runs under load, causing gaps
# of 60-100+ minutes on a nominal 5-minute schedule. This workflow is kept
# around for manual/on-demand runs only.

concurrency:
  group: pickem-scheduler
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      run_sync_week:
        description: "Also run sync-week?"
        required: false
        default: "false"
      run_advance_week:
        description: "Also run advance-week?"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Sync games
        run: |
          echo "==> Syncing NFL games"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X POST "${{ secrets.APP_URL }}/api/sync-games" \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"league_id":"${{ secrets.LEAGUE_ID }}"}'

      - name: Grade week
        run: |
          echo "==> Grading picks"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X POST "${{ secrets.APP_URL }}/api/grade-week" \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"league_id":"${{ secrets.LEAGUE_ID }}"}'

      - name: Send pick reminders
        run: |
          echo "==> Sending pick reminders"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X POST "${{ secrets.APP_URL }}/api/send-reminders" \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"league_id":"${{ secrets.LEAGUE_ID }}"}'

      - name: Advance week (if current week is fully final)
        if: github.event.inputs.run_advance_week == 'true'
        run: |
          echo "==> Checking if we should advance to next week"
          CODE=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X POST "${{ secrets.APP_URL }}/api/advance-week" \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"league_id":"${{ secrets.LEAGUE_ID }}","season_type":2}' \
            -o /tmp/advance-week.json -w "%{http_code}")
          echo "HTTP $CODE"
          cat /tmp/advance-week.json
          if [ "$CODE" -ge 500 ]; then
            exit 1
          fi

      - name: Sync week config
        if: github.event.inputs.run_sync_week == 'true'
        run: |
          echo "==> Syncing week config"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -X POST "${{ secrets.APP_URL }}/api/sync-week" \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"league_id":"${{ secrets.LEAGUE_ID }}"}'
